name: Feature request
description: Suggest a focused Component Vault improvement
title: "[Feature]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Keep requests focused on a concrete Roblox Studio workflow or compatibility problem.
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: What is difficult or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should Component Vault do instead?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example use case
      description: Describe a real UI/component workflow where this would help.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional workarounds or related approaches you have tried.
